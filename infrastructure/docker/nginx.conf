server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing: unknown paths fall back to index.html so client-side
    # routes (e.g. /documents/abc) don't 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
