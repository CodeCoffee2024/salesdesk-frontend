server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing: unknown paths fall back to index.html so client-side
    # routes (e.g. /documents/abc) don't 404 on a hard refresh.
    #
    # index.html itself must never be cached: it's what references the
    # content-hashed JS/CSS bundle filenames below, so a stale cached
    # index.html silently keeps serving an old build's bundle forever,
    # surviving a normal refresh (no Cache-Control means browsers fall back
    # to heuristic freshness, not always-revalidate).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
