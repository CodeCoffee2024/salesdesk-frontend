<app-impersonation-banner></app-impersonation-banner>

<ng-container *ngIf="isPublicRoute$ | async; else appShell">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #appShell>
  <div class="app-shell">
    <app-sidebar></app-sidebar>

    <div class="app-shell__main">
      <app-topbar></app-topbar>
      <app-breadcrumb class="app-shell__breadcrumb"></app-breadcrumb>

      <main class="app-shell__content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</ng-template>
