<div class="sidebar-backdrop" *ngIf="isOpen" (click)="close()"></div>

<aside class="sidebar" [class.sidebar--open]="isOpen">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor" />
      </svg>
    </span>
    <span class="brand__name">SalesDesk</span>

    <button type="button" class="sidebar__close" aria-label="Close menu" (click)="close()">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>

  <div class="nav-section">
    <p class="nav-section__label">Workspace</p>

    <nav class="nav-list">
      <a
        *ngFor="let item of navItems"
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="nav-item--active"
      >
        <span class="nav-item__icon" aria-hidden="true"><i class="bi" [ngClass]="'bi-' + item.icon"></i></span>
        <span class="nav-item__label">{{ item.label }}</span>
      </a>
    </nav>
  </div>

  <div class="nav-section" *appHasRole="['SystemAdmin', 'WorkspaceAdmin', 'SalesManager']">
    <p class="nav-section__label">Settings</p>

    <nav class="nav-list">
      <a class="nav-item" routerLink="/settings/workspace" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true"><i class="bi bi-building"></i></span>
        <span class="nav-item__label">Business profile</span>
      </a>
      <a class="nav-item" routerLink="/settings/reminders" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true"><i class="bi bi-bell"></i></span>
        <span class="nav-item__label">Reminders</span>
      </a>
    </nav>
  </div>

  <div class="nav-section" *appHasRole="['SystemAdmin']">
    <p class="nav-section__label">Platform</p>

    <nav class="nav-list">
      <a class="nav-item" routerLink="/admin" routerLinkActive="nav-item--active" [routerLinkActiveOptions]="{ exact: false }">
        <span class="nav-item__icon" aria-hidden="true"><i class="bi bi-gear"></i></span>
        <span class="nav-item__label">Admin console</span>
      </a>
    </nav>
  </div>
</aside>
