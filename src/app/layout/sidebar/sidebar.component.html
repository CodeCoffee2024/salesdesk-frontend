<aside class="sidebar">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor" />
      </svg>
    </span>
    <span class="brand__name">SalesDesk</span>
  </div>

  <div class="nav-section">
    <p class="nav-section__label">Workspace</p>

    <nav class="nav-list">
      <a
        *ngFor="let item of navItems"
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="nav-item--active"
      >
        <span class="nav-item__icon" [ngSwitch]="item.icon" aria-hidden="true">
          <svg *ngSwitchCase="'overview'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
            <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
            <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
            <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
          </svg>
          <svg *ngSwitchCase="'documents'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 3.5h8l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V5A1.5 1.5 0 0 1 6 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M8 12h8M8 15.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'customers'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="8.5" r="3" stroke="currentColor" stroke-width="1.6" />
            <path d="M3.5 19c.7-3.2 3-5 5.5-5s4.8 1.8 5.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M15.5 5.8c1.3.4 2.2 1.5 2.2 2.9 0 1.4-.9 2.5-2.2 2.9M18 19c-.5-2.4-1.8-4-3.6-4.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'products'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 8 12 4l8 4-8 4-8-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M4 8v8l8 4 8-4V8M12 12v8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <svg *ngSwitchCase="'templates'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3.5" y="4" width="17" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M3.5 9h17" stroke="currentColor" stroke-width="1.6" />
            <path d="M8 13h8M8 16.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="nav-item__label">{{ item.label }}</span>
      </a>
    </nav>
  </div>

  <div class="nav-section" *appHasRole="['SystemAdmin', 'WorkspaceAdmin', 'SalesManager']">
    <p class="nav-section__label">Automations</p>

    <nav class="nav-list">
      <a class="nav-item" routerLink="/settings/reminders" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 4.5c-1 0-1.8.8-1.8 1.8v.6C7.8 7.5 6 9.7 6 12.3v3.2l-1.6 1.9c-.3.4 0 1 .5 1h14.2c.5 0 .8-.6.5-1L18 15.5v-3.2c0-2.6-1.8-4.8-4.2-5.4v-.6c0-1-.8-1.8-1.8-1.8Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path d="M9.8 19.5a2.2 2.2 0 0 0 4.4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="nav-item__label">Reminders</span>
      </a>
    </nav>
  </div>

  <div class="nav-section" *appHasRole="['SystemAdmin']">
    <p class="nav-section__label">Platform</p>

    <nav class="nav-list">
      <a class="nav-item" routerLink="/admin" routerLinkActive="nav-item--active" [routerLinkActiveOptions]="{ exact: false }">
        <span class="nav-item__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M17.8 6.2l-1.5 1.5M7.7 16.3l-1.5 1.5M17.8 17.8l-1.5-1.5M7.7 7.7 6.2 6.2"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span class="nav-item__label">Admin console</span>
      </a>
    </nav>
  </div>
</aside>
