<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand__mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 1a1 1 0 0 0-1 1v4.586a1 1 0 0 0 .293.707l7 7a1 1 0 0 0 1.414 0l4.586-4.586a1 1 0 0 0 0-1.414l-7-7A1 1 0 0 0 6.586 1zm4 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" fill="currentColor" />
        </svg>
      </span>
      SalesDesk
    </div>

    <ng-container *ngIf="!submitted; else confirmation">
      <h1 class="auth-heading">Reset your password</h1>
      <p class="auth-subtext">Enter your email and we'll send you a link to reset it.</p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="auth-field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
          />
          <span class="auth-field-error" *ngIf="form.controls.email.invalid && form.controls.email.touched">
            Enter a valid email address.
          </span>
        </div>

        <button type="submit" class="auth-submit" [disabled]="submitting">
          {{ submitting ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>
    </ng-container>

    <ng-template #confirmation>
      <h1 class="auth-heading">Check your email</h1>
      <p class="auth-subtext">
        If an account exists for that address, we've sent a link to reset your password.
      </p>
    </ng-template>

    <div class="auth-footer">
      <p><a routerLink="/login">Back to sign in</a></p>
    </div>
  </div>
</div>
