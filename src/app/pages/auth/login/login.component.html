<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">SalesDesk</div>
    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-subtext">Sign in to pick up where you left off.</p>

    <div class="auth-error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="auth-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        <span class="auth-field-error" *ngIf="form.controls.email.invalid && form.controls.email.touched">
          Enter a valid email address.
        </span>
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        <span class="auth-field-error" *ngIf="form.controls.password.invalid && form.controls.password.touched">
          Password is required.
        </span>
      </div>

      <button type="submit" class="auth-submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="auth-footer">
      <p><a routerLink="/forgot-password">Forgot your password?</a></p>
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>
</div>
