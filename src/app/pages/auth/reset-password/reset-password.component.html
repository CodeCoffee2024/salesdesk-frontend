<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">SalesDesk</div>

    <ng-container *ngIf="token; else missingToken">
      <h1 class="auth-heading">Set a new password</h1>
      <p class="auth-subtext">Choose a new password for your account.</p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="auth-field">
          <label for="newPassword">New password</label>
          <input
            id="newPassword"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
            [class.is-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
          />
          <span class="auth-field-error" *ngIf="form.controls.newPassword.invalid && form.controls.newPassword.touched">
            Password must be at least 8 characters.
          </span>
        </div>

        <p class="auth-field-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" class="auth-submit" [disabled]="submitting">
          {{ submitting ? 'Saving…' : 'Reset password' }}
        </button>
      </form>
    </ng-container>

    <ng-template #missingToken>
      <h1 class="auth-heading">Invalid reset link</h1>
      <p class="auth-subtext">This link is missing its reset token. Request a new one below.</p>
    </ng-template>

    <div class="auth-footer">
      <p><a routerLink="/forgot-password">Request a new reset link</a></p>
      <p><a routerLink="/login">Back to sign in</a></p>
    </div>
  </div>
</div>
