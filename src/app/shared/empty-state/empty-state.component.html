<div class="empty-state">
  <span class="empty-state__icon" [ngSwitch]="icon" aria-hidden="true">
    <svg *ngSwitchCase="'document'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 6h14l8 8v26a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      <path d="M28 6v8h8" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      <path d="M18 26h12M18 32h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <svg *ngSwitchDefault viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="21" cy="21" r="13" stroke="currentColor" stroke-width="2" />
      <path d="m30.5 30.5 8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M17 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </span>

  <h1 class="empty-state__heading">{{ heading }}</h1>
  <p class="empty-state__description">{{ description }}</p>

  <a *ngIf="actionLabel" class="empty-state__action" [routerLink]="actionLink">{{ actionLabel }}</a>
</div>
