<span class="info-tooltip" [class.info-tooltip--open]="open" (mouseenter)="open = true" (mouseleave)="close()">
  <button type="button" class="info-tooltip__trigger" aria-label="More info" (click)="toggle()">
    <i class="bi bi-info-circle" aria-hidden="true"></i>
  </button>
  <span class="info-tooltip__bubble" role="tooltip">{{ text }}</span>
</span>
